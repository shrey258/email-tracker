<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="google-client-id" content="YOUR-GOOGLE-CLIENT-ID">
<title>Email tracker</title>
<script src="https://accounts.google.com/gsi/client" async></script>
<link rel="icon" href="favicon.svg">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <header class="top">
    <span class="product">Email tracker</span>
    <div class="accounts" hidden>
      <select id="account" aria-label="Account"></select>
      <button type="button" id="sign-out">Sign out</button>
    </div>
  </header>
  <section class="mails" hidden>
    <h1>Sent</h1>
    <nav class="tabs" aria-label="Show"></nav>
    <div class="bar">
      <input type="search" id="search" placeholder="Search subject or recipient" aria-label="Search">
      <select id="range" aria-label="Time range">
        <option value="all">Any time</option>
        <option value="today">Today</option>
        <option value="week">Past week</option>
        <option value="month">Past month</option>
      </select>
      <select id="sort" aria-label="Sort by">
        <option value="activity">Latest activity</option>
        <option value="sent">Date sent</option>
        <option value="reads">Most read</option>
      </select>
      <button type="button" id="clear" hidden>Clear</button>
    </div>
    <div class="list"></div>
  </section>
  <div class="note" id="status"></div>
  <div class="google-button" id="google-button" hidden></div>
</main>
<script src="dom.js"></script>
<script src="time.js"></script>
<script src="sessions.js"></script>
<script src="mail-row.js"></script>
<script src="mail-list.js"></script>
<script src="app.js"></script>
</body>
</html>
